# fly.toml app configuration file generated for rleu-api on 2025-11-23T07:30:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rleu-api'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
